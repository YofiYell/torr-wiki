name: Deploy Quartz to GitHub Pages

on:
  push:
    branches:
      - v5
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy-v5:
    name: Build and deploy Quartz
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache Quartz plugins
        uses: actions/cache@v5
        with:
          path: .quartz/plugins
          key: ${{ runner.os }}-plugins-${{ hashFiles('quartz.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-plugins-

      - name: Install dependencies
        run: npm install

      - name: Install Quartz plugins
        run: npx quartz plugin install

      - name: Compile published CSS
        run: node scripts/compile-wiki-css.mjs

      - name: Validate and extract ITS settings
        run: node scripts/compile-wiki-theme.mjs

      - name: Test transclusion rendering
        run: npx tsx --test quartz/components/renderPage.test.ts

      - name: Test publication exclusions
        run: npx tsx --test quartz/util/publicationIgnore.test.ts quartz/plugins/pageTypes/dispatcher.test.ts

      - name: Test Basic 5e statblock rendering
        run: npx tsx --test quartz/plugins/transformers/statblocks.test.ts

      - name: Test Markdown table parity
        run: npx tsx --test quartz/styles/markdownTables.test.ts

      - name: Build Wiki
        run: npx quartz build -d content -v

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
